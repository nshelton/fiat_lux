[env:nano_33_iot]
platform = atmelsam
board = nano_33_iot
framework = arduino
monitor_speed = 115200
lib_deps =
    fastled/FastLED
    arduino-libraries/WiFiNINA
    arduino-libraries/ArduinoHttpClient
    bblanchon/ArduinoJson
    paulstoffregen/Time
    adafruit/Adafruit AHTX0
    jandrassy/ArduinoOTA

; First flash over USB: pio run -e nano_33_iot -t upload
; After that, OTA: set upload_port to the device IP (printed on serial at boot),
; password must match ota_password in include/secrets.h.
[env:ota]
extends = env:nano_33_iot
upload_protocol = custom
upload_port = 192.168.0.100
upload_command = curl -f --progress-bar -u arduino:fiatlux -T .pio/build/ota/firmware.bin http://$UPLOAD_PORT:65280/sketch
