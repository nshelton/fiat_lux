[env]
platform = espressif32
board = adafruit_itsybitsy_esp32
framework = arduino
monitor_speed = 115200

[env:itsybitsy]
; anim_test is panel-env diagnostic kit, not a firmware mode
build_src_filter = +<*> -<bringup/> -<panel/> -<anim_test.cpp>
lib_deps =
    fastled/FastLED
    arduino-libraries/ArduinoHttpClient
    bblanchon/ArduinoJson
    adafruit/Adafruit AHTX0

; minimal hardware-bringup firmware: blink + serial counter, nothing else
[env:bringup]
build_src_filter = +<bringup/>

; panel + level-shifter validation: matrix and test patterns, no wifi.
; Nothing else is linked in, so a glitch here is the data path or RMT timing
; and cannot be wifi contention. See src/panel/main.cpp.
[env:panel]
build_src_filter = +<panel/> +<matrix.cpp> +<font.cpp> +<state.cpp> +<anim_test.cpp>
lib_deps = fastled/FastLED

; First flash over USB: pio run -e itsybitsy -t upload
; After that, OTA: espota on port 3232, password must match ota_password in
; include/secrets.h. Use the device IP if fiatlux.local does not resolve.
[env:ota]
extends = env:itsybitsy
upload_protocol = espota
upload_port = fiatlux.local
upload_flags = --auth=fiatlux
